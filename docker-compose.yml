# Whole system:          docker compose up --build      (API on http://localhost:8000)
# Only the database:     docker compose up -d db         (for running the API with uv locally)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apart
      POSTGRES_PASSWORD: apart
      POSTGRES_DB: apartworld
    ports:
      - "5433:5432"   # 5433 on the host, so a local PostgreSQL on 5432 does not clash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apart -d apartworld"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file:
      - path: .env          # LLM key and settings (copy .env.example to .env)
        required: false
    environment:
      # Inside Docker the database is the "db" service, not localhost:5433.
      DATABASE_URL: postgresql+psycopg://apart:apart@db:5432/apartworld
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
